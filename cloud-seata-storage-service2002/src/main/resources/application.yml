server:
  port: 2002

spring:
  application:
      name: cloud-seata-storage-service
  cloud:
    alibaba:
      seata:
        tx-service-group: dww_tx_group #自定义事务组的名称需要和seata-server中file.conf中定义的一致
    nacos:
      discovery:
        server-addr: localhost:8848
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.jdbc.Driver
    username: root
    password: 120653
    url: jdbc:mysql://localhost:3308/seata_storage?useSSL=false


feign:
  hystrix:
    enabled: false

logging:
  level:
    io:
      seata: info

mybatis:
    mapper-locations: classpath:mapper/*.xml
