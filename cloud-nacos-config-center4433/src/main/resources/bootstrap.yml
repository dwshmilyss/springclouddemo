server:
  port: 4433

spring:
  application:
    name: cloud-nacos-config-center
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848 #nacos服务注册中心地址
      config:
        server-addr: localhost:8848 #nacos配置管理中心地址
        file-extension: yaml #配置文件的类型

# ${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
# nacos上的配置文件遵循上面的命名规则，对应到实际文件名就是：cloud-nacos-config-center-dev.yaml


